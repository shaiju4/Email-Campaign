<table border="1" cellpadding="8" cellspacing="0" style="border-collapse: collapse; width: 100%;">
    <thead style="background-color: #f2f2f2;">
        <tr>
            <th align="left">Name</th>
            <th align="left">Email</th>
            <th align="center">Subscribed</th>
        </tr>
    </thead>
    <tbody>
        {% for r in recipients %}
        <tr>
            <td>{{ r.name }}</td>
            <td>{{ r.email }}</td>
            <td align="center">
                {% if r.is_subscribed %}
                    ✅ Yes
                {% else %}
                    ❌ No
                {% endif %}
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3" align="center">No recipients found</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
